<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mark Attendance | HRMS</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.side{position:fixed;left:0;top:0;bottom:0;width:245px;background:#fff;border-right:1px solid #ddd;padding:20px 14px}.brand{font-size:21px;font-weight:800;padding:8px 12px 24px}.brand span{color:#2563eb}.nav button{display:block;width:100%;border:0;background:none;text-align:left;padding:12px 14px;border-radius:9px;margin:3px 0;color:#526070;cursor:pointer}.nav button:hover{background:#eef4ff;color:#2563eb}.main{margin-left:245px;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.user{background:#fff;border:1px solid #ddd;padding:10px 14px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #e3e7ee;border-radius:14px;padding:18px;margin-bottom:16px}.stat{font-size:28px;font-weight:800;margin-top:8px}.muted{color:#778397;font-size:13px}.btn{border:0;border-radius:9px;padding:12px 20px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e8eef8}.login{max-width:390px;margin:80px auto;background:#fff;padding:30px;border-radius:16px;border:1px solid #ddd}.field{width:100%;padding:12px;border:1px solid #d5dbe5;border-radius:9px;margin:8px 0 14px}.danger{color:#c0392b}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}@media(max-width:800px){.side{width:70px}.brand{font-size:0}.brand span{font-size:18px}.nav button{font-size:0;text-align:center}.main{margin-left:70px;padding:18px}.grid{grid-template-columns:repeat(2,1fr)}} </style></head>
<body><div id="login" class="login"><h2>Mark Attendance</h2><p class="muted">HRMS Login</p><input id="email" class="field" type="email" placeholder="Login ID / Email"><input id="password" class="field" type="password" placeholder="Password"><button class="btn primary" style="width:100%" onclick="login()">Login</button><p id="loginMsg" class="danger"></p></div>
<div id="app" style="display:none"><aside class="side"><div class="brand">Mark <span>Attendance</span></div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><h1 id="title">Dashboard</h1><div class="user"><span id="uname"></span> · <b id="urole"></b></div></div><div id="content"></div></main></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://rlidcatrwonemshwzafp.supabase.co','sb_publishable_ocJhWyfPg9rVhYROn_Vj0Q_DSSgxeuE'),ADMIN='junjharsingh740@gmail.com';let user,emp,role='employee';
const menus={employee:[['dashboard','🏠 Dashboard'],['attendance','📍 Mark Attendance'],['history','📅 Attendance History'],['leave','🏖️ Leave'],['regular','📝 Regularization'],['od','🚗 OD'],['payslip','💰 Payslip'],['profile','👤 My Profile']],manager:[['dashboard','🏠 Manager Dashboard'],['team','👥 My Team'],['attendance','📅 Team Attendance'],['leave','🏖️ Leave Approvals'],['regular','📝 Regularization'],['od','🚗 OD Approvals'],['reports','📊 Team Reports']],hr:[['dashboard','🏠 HR Dashboard'],['employees','👥 Employees'],['create-user','➕ Create Employee ID'],['attendance','📅 Attendance'],['leave','🏖️ Leave Management'],['regular','📝 Regularization'],['od','🚗 OD Management'],['payroll','💰 Payroll / Payslip'],['reports','📊 HR Reports']],admin:[['dashboard','🛡️ Admin Dashboard'],['employees','👥 Employee Master'],['attendance','📅 All Attendance'],['leave','🏖️ Leave Management'],['regular','📝 Regularization'],['od','🚗 OD Management'],['payroll','💰 Payroll'],['reports','📊 Reports'],['settings','⚙️ Settings']]};
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function init(){const r=await sb.auth.getUser();user=r.data.user;if(!user)return;role=user.email.toLowerCase()===ADMIN?'admin':'employee';const p=await sb.from('mark_employees').select('*').eq('id',user.id).maybeSingle();if(p.data){emp=p.data;role=p.data.role||role}else if(role!=='admin'){$('loginMsg').textContent='Employee ID/profile not found. Please contact HR.';return;}$('login').style.display='none';$('app').style.display='block';$('uname').textContent=emp?.full_name||user.email;$('urole').textContent=role.toUpperCase();nav();show('dashboard')}
function nav(){$('nav').innerHTML=(menus[role]||menus.employee).map(x=>'<button onclick="show(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'<button onclick="logout()">🚪 Logout</button>'}
window.show=async function(id){let m=(menus[role]||menus.employee).find(x=>x[0]===id);$('title').textContent=m?m[1].replace(/^\S+ /,''):'Dashboard';if(id==='dashboard')dashboard();else if(id==='attendance')attendance();else if(id==='history')history();else if(id==='employees'||id==='team')employees();else if(id==='create-user')createUser();else if(id==='leave'||id==='regular'||id==='od')requests(id);else if(id==='profile')profile();else simple(m?m[1]:'Section','This module is ready for role-based HRMS expansion.')};
function dashboard(){let s=role==='employee'?'<div class="card"><h3>Today Attendance</h3><button class="btn primary" onclick="mark(\'in\')">Check In</button><button class="btn secondary" onclick="mark(\'out\')">Check Out</button><p id="msg" class="muted"></p></div>':'<div class="card"><h3>Role Dashboard</h3><p class="muted">Logged in as '+role.toUpperCase()+'. Use the menu for '+(role==='manager'?'team management':role==='hr'?'HR operations':'complete system administration')+'.</p></div>';$('content').innerHTML='<div class="grid"><div class="card"><div class="muted">Role</div><div class="stat">'+role.toUpperCase()+'</div></div><div class="card"><div class="muted">Employee</div><div class="stat" style="font-size:18px">'+esc(emp?.employee_code)+'</div></div><div class="card"><div class="muted">Department</div><div class="stat" style="font-size:18px">'+esc(emp?.department||'-')+'</div></div><div class="card"><div class="muted">Status</div><div class="stat" style="font-size:18px">'+esc(emp?.status||'active')+'</div></div></div>'+s}
window.mark=async function(type){let data={employee_id:user.id,attendance_date:new Date().toISOString().slice(0,10),status:'present'};let geo=null;if(navigator.geolocation)try{geo=await new Promise((a,b)=>navigator.geolocation.getCurrentPosition(a,b,{enableHighAccuracy:true,timeout:8000}))}catch(e){}let now=new Date().toISOString();if(type==='in'){data.check_in=now;if(geo){data.check_in_lat=geo.coords.latitude;data.check_in_lng=geo.coords.longitude}}else{data.check_out=now;if(geo){data.check_out_lat=geo.coords.latitude;data.check_out_lng=geo.coords.longitude}}let r=await sb.from('mark_attendance').upsert(data,{onConflict:'employee_id,attendance_date'});$('msg').textContent=r.error?'Error: '+r.error.message:(type==='in'?'Check-in saved successfully.':'Check-out saved successfully.')}
function attendance(){$('content').innerHTML='<div class="card"><h2>Attendance</h2><p class="muted">Role: '+role.toUpperCase()+'</p><button class="btn primary" onclick="mark(\'in\')">Check In</button><button class="btn secondary" onclick="mark(\'out\')">Check Out</button><p id="msg" class="muted"></p></div>'}
async function history(){let r=await sb.from('mark_attendance').select('*').eq('employee_id',user.id).order('attendance_date',{ascending:false});let h='<div class="card"><h2>Attendance History</h2><table class="table"><tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th></tr>';(r.data||[]).forEach(x=>h+='<tr><td>'+esc(x.attendance_date)+'</td><td>'+esc(x.check_in?new Date(x.check_in).toLocaleTimeString('en-IN'):'-')+'</td><td>'+esc(x.check_out?new Date(x.check_out).toLocaleTimeString('en-IN'):'-')+'</td><td>'+esc(x.status)+'</td></tr>');$('content').innerHTML=h+'</table></div>'}
async function employees(){let r=await sb.from('mark_employees').select('*').order('full_name');let h='<div class="card"><h2>'+(role==='manager'?'My Team':'Employee Master')+'</h2><table class="table"><tr><th>Code</th><th>Name</th><th>Email</th><th>Dept.</th><th>Role</th></tr>';(r.data||[]).filter(x=>role!=='manager'||x.manager_id===user.id||x.id===user.id).forEach(x=>h+='<tr><td>'+esc(x.employee_code)+'</td><td>'+esc(x.full_name)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.department||'-')+'</td><td>'+esc(x.role)+'</td></tr>');$('content').innerHTML=h+'</table></div>'}
async function requests(type){let table=type==='leave'?'mark_leave_requests':type==='regular'?'mark_regularization_requests':'mark_od_requests';let r=await sb.from(table).select('*').order('created_at',{ascending:false});$('content').innerHTML='<div class="card"><h2>'+type.toUpperCase()+' Management</h2><p class="muted">'+(r.error?'Access error: '+r.error.message:'Records available: '+(r.data||[]).length)+'</p></div>'}
function createUser(){if(role!=='hr'&&role!=='admin'){simple('Access Denied','Only HR can create Employee IDs.');return}$('content').innerHTML='<div class="card"><h2>Create Employee ID</h2><p class="muted">ID format: EMP001, EMP002, EMP003...</p><input id="cu_name" class="field" placeholder="Full Name"><input id="cu_email" class="field" placeholder="Login Email"><select id="cu_role" class="field"><option value="employee">Employee</option><option value="manager">Manager</option><option value="hr">HR</option></select><p class="muted">Admin role is not available for creation.</p><button class="btn primary" onclick="cuMsg()">Create Employee ID</button><p id="cu_msg" class="muted"></p></div>'}window.cuMsg=async function(){
 if(role!=='hr'&&role!=='admin')return;
 const name=$('cu_name').value.trim(),email=$('cu_email').value.trim().toLowerCase(),rrole=$('cu_role').value;
 if(!name||!email){$('cu_msg').textContent='Name and email are required.';return}
 if(!['employee','manager','hr'].includes(rrole)){ $('cu_msg').textContent='Invalid role.';return}
 $('cu_msg').textContent='Creating account...';
 try{
  const authClient=createClient('https://rlidcatrwonemshwzafp.supabase.co','sb_publishable_ocJhWyfPg9rVhYROn_Vj0Q_DSSgxeuE',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const {data:au,error:ae}=await authClient.auth.signUp({email,password:(prompt('Set login password for '+email)||''),options:{data:{full_name:name,role:rrole}}});
  if(ae)throw ae;if(!au.user)throw new Error('Account could not be created.');
  const {data:last}=await sb.from('mark_employees').select('employee_code').like('employee_code','EMP%').order('employee_code',{ascending:false}).limit(1);
  let n=1,m=last?.[0]?.employee_code?.match(/^EMP(\\d+)$/);if(m)n=parseInt(m[1],10)+1;
  const code='EMP'+String(n).padStart(3,'0');
  const ins=await sb.from('mark_employees').insert({id:au.user.id,employee_code:code,full_name:name,email,role:rrole,status:'active'});
  if(ins.error)throw ins.error;
  $('cu_msg').textContent='Created successfully: '+code+' | Role: '+rrole.toUpperCase()+(au.user.confirmed_at?'':' | Email verification required');
 }catch(e){$('cu_msg').textContent='Error: '+(e.message||e)}
};function profile(){$('content').innerHTML='<div class="card"><h2>My Profile</h2><div class="row"><span>Name</span><b>'+esc(emp?.full_name)+'</b></div><div class="row"><span>Employee Code</span><b>'+esc(emp?.employee_code)+'</b></div><div class="row"><span>Department</span><b>'+esc(emp?.department||'-')+'</b></div><div class="row"><span>Designation</span><b>'+esc(emp?.designation||'-')+'</b></div><div class="row"><span>Role</span><b>'+esc(role)+'</b></div></div>'}
function simple(t,d){$('content').innerHTML='<div class="card"><h2>'+t+'</h2><p class="muted">'+d+'</p></div>'}
window.login=async function(){let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)$('loginMsg').textContent=r.error.message;else init()}
window.logout=async function(){await sb.auth.signOut();location.reload()};init();
</script></body></html>
