name: Update SEO Job Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate job pages and sitemap
        run: python scripts/generate_jobs.py
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs sitemap.xml
          git diff --cached --quiet || git commit -m 'Update job SEO pages and sitemap'
          git push
