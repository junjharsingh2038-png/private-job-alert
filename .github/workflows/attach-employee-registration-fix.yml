name: Attach Employee Registration Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  attach:
    if: github.event.head_commit.message != 'Attach employee registration fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach fix script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('seeker.html');s=p.read_text()
          tag='<script src="employee-registration-fix.js?v=20260902"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/attach-employee-registration-fix.yml
          git add seeker.html employee-registration-fix.js .github/workflows/attach-employee-registration-fix.yml
          git diff --cached --quiet || git commit -m 'Attach employee registration fix'
          git push
