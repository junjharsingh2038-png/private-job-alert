name: Make HR dashboard cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert dashboard sections to clickable cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hr.html')
          text = p.read_text(encoding='utf-8')

          old = "root.innerHTML='<section class=\"info-section\"><h2>Why HRs Should Post Here</h2>"
          new = "root.innerHTML='<section class=\"info-section\"><h2>HR Dashboard</h2><div class=\"info-grid dashboard-cards\"><article class=\"info-card\" data-card=\"posted\"><b>01</b><h3>My Posted Jobs</h3><p>अपनी पोस्ट की गई सभी vacancies यहाँ देखें।</p><span class=\"info-link\">View Posted Jobs →</span></article><article class=\"info-card\" data-card=\"direct\"><b>02</b><h3>Applications Received</h3><p>आपकी vacancies पर प्राप्त applications यहाँ देखें।</p><span class=\"info-link\">View Applications →</span></article></div></section><section class=\"info-section\"><h2>Why HRs Should Post Here</h2>"
          if old in text and 'dashboard-cards' not in text:
              text = text.replace(old, new, 1)

          old_handle = "if(key==='free'){showPost();return}"
          new_handle = "if(key==='posted'){await loadDashboard();const s=$('postedJobsSection');if(s)s.classList.remove('hidden');scrollTo('postedJobsSection');return}\nif(key==='free'){showPost();return}"
          if old_handle in text and "key==='posted'" not in text:
              text = text.replace(old_handle, new_handle, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit dashboard card update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hr.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add clickable HR dashboard cards'
          git push
