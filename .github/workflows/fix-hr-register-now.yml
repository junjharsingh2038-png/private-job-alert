name: Fix HR Register Now
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix HR register now - corrected'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct HR dashboard sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('hr.html')
          s=p.read_text()
          s=re.sub(r'id="postedJobsSection" class="info-section(?! hidden)"','id="postedJobsSection" class="info-section hidden"',s,count=1)
          s=re.sub(r'id="applicationsSection" class="info-section(?! hidden)"','id="applicationsSection" class="info-section hidden"',s,count=1)
          p.write_text(s)
          PY
      - name: Commit corrected HR page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hr.html
          git diff --cached --quiet || git commit -m 'Fix HR register now - corrected'
          git push
