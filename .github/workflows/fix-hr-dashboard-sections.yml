name: Fix HR dashboard sections

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hide dashboard sections until opened
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('hr.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'id="postedJobsSection" class="info-section(?! hidden)"', 'id="postedJobsSection" class="info-section hidden"', text, count=1)
          text = re.sub(r'id="applicationsSection" class="info-section(?! hidden)"', 'id="applicationsSection" class="info-section hidden"', text, count=1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit dashboard fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hr.html
          git diff --cached --quiet && exit 0
          git commit -m 'Hide HR dashboard job and application sections'
          git push
