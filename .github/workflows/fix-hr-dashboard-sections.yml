name: Fix HR dashboard sections

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hide job/application sections until opened
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('hr.html')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              'id=\\"postedJobsSection\\" class=\\"info-section\\"',
              'id=\\"postedJobsSection\\" class=\\"info-section hidden\\"'
          )
          text = text.replace(
              'id=\\"applicationsSection\\" class=\\"info-section\\"',
              'id=\\"applicationsSection\\" class=\\"info-section hidden\\"'
          )
          text = text.replace(
              "if(key==='direct'||key==='receive'){await loadDashboard();scrollTo('applicationsSection');return}",
              "if(key==='direct'||key==='receive'){await loadDashboard();const s=$('applicationsSection');if(s)s.classList.remove('hidden');scrollTo('applicationsSection');return}"
          )

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit dashboard fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hr.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix HR dashboard initial sections'
          git push
