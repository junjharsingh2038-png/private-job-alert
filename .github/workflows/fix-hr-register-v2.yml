name: Fix HR Register V2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix HR register JavaScript syntax'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix HR register syntax and auth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hr.html')
          s=p.read_text()
          s=s.replace("const u=const updated=await sb.auth.updateUser", "const updated=await sb.auth.updateUser")
          s=s.replace("if(u.error)throw u.error;", "")
          s=s.replace('<script src="app.js" type="module"></script>', '<script src="app.js"></script>', 1)
          s=s.replace("$hr('passWrap').classList.toggle('hidden',r);$hr('passWrap input').required=!r;", "$hr('passWrap').classList.remove('hidden');$hr('passWrap input').required=true;")
          p.write_text(s)
          PY
      - name: Commit corrected HR page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hr.html
          git diff --cached --quiet || git commit -m 'Fix HR register JavaScript syntax'
          git push