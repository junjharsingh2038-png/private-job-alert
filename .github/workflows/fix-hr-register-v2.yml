name: Fix HR Register V2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix HR auth flow permanently'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix HR authentication flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hr.html')
          s=p.read_text()
          s=s.replace('<script src="app.js" type="module"></script>', '<script src="app.js"></script>', 1)
          s=s.replace("$hr('passWrap').classList.toggle('hidden',r);$hr('passWrap input').required=!r;", "$hr('passWrap').classList.remove('hidden');$hr('passWrap input').required=true;")
          s=s.replace("pending={email,hr_name:name,company};", "const password=String(f.get('password')||'');if(password.length<6){msg.className='danger';msg.textContent='Password कम से कम 6 characters का होना चाहिए।';return;}pending={email,hr_name:name,company,password};")
          s=s.replace("await sb.auth.updateUser({data:pending});", "await sb.auth.updateUser({password:pending.password,data:{hr_name:pending.hr_name,company:pending.company}});")
          p.write_text(s)
          PY
      - name: Commit corrected HR page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hr.html
          git diff --cached --quiet || git commit -m 'Fix HR auth flow permanently'
          git push