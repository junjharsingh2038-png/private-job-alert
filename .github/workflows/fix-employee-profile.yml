name: Fix Employee Profile Registration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix employee profile registration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch employee registration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('seeker.html')
          s=p.read_text()
          old="user=r.data.user;showDash()"
          new="user=r.data.user;await savePendingProfile();showDash()"
          if old not in s:
              raise SystemExit('login hook not found')
          s=s.replace(old,new,1)
          marker="$('loginForm').onsubmit=async e=>"
          helper="async function savePendingProfile(){if(!user)return;const raw=localStorage.getItem('pja_pending_profile');if(!raw)return;try{const x=JSON.parse(raw),p=await sb.from('job_seeker_profiles').upsert({id:user.id,full_name:x.full_name,mobile:x.mobile,location:x.location,qualification:x.qualification,experience:x.experience,skills:x.skills});if(!p.error)localStorage.removeItem('pja_pending_profile')}catch(e){}}"
          if helper not in s:
              s=s.replace(marker,helper+marker,1)
          old2="if(r.data.user){const p=await sb.from('job_seeker_profiles').upsert({id:r.data.user.id,full_name:f.get('full_name'),mobile:f.get('mobile'),location:f.get('location'),qualification:f.get('qualification'),experience:f.get('experience'),skills:f.get('skills')});if(p.error){msg('registerMsg','Account created, but profile could not be saved: '+p.error.message,'danger');return}}msg('registerMsg','Registration successful. Please verify your email if required, then login.','success')"
          new2="if(r.data.user){const pending={full_name:f.get('full_name'),mobile:f.get('mobile'),location:f.get('location'),qualification:f.get('qualification'),experience:f.get('experience'),skills:f.get('skills')};if(r.data.session){const p=await sb.from('job_seeker_profiles').upsert({id:r.data.user.id,...pending});if(p.error){localStorage.setItem('pja_pending_profile',JSON.stringify(pending));msg('registerMsg','Account created. Profile will be saved after email verification and login.','success')}}else{localStorage.setItem('pja_pending_profile',JSON.stringify(pending));msg('registerMsg','Account created. Please verify your email, then login. Your profile details are saved for completion.','success');return}}msg('registerMsg','Registration successful. Please verify your email if required, then login.','success')"
          if old2 not in s:
              raise SystemExit('registration block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-employee-profile.yml
          git add seeker.html .github/workflows/fix-employee-profile.yml
          git diff --cached --quiet || git commit -m 'Fix employee profile registration'
          git push
