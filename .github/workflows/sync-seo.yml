name: Sync SEO Job Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate job pages and sitemap
        env:
          SUPABASE_URL: https://rlidcatrwonemshwzafp.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ocJhWyfPg9rVhYROn_Vj0Q_DSSgxeuE
          SITE_URL: https://junjharsingh2038-png.github.io/private-job-alert
        run: node scripts/generate-seo.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml jobs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "SEO: sync jobs and sitemap"
            git push
          fi
