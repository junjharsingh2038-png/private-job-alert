name: Activate Employee OTP
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    if: github.event.head_commit.message != 'Activate Employee OTP UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate OTP script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('seeker.html'); s=p.read_text()
          s=re.sub(r'<script src="employee-registration-fix\.js(?:\?v=[^"]+)?"></script>','',s)
          tag='<script src="employee-registration-fix.js?v=20260905"></script>'
          s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seeker.html
          git diff --cached --quiet || git commit -m 'Activate Employee OTP UI'
          git push