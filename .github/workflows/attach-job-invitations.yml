name: Attach Job Invitations
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  attach:
    if: github.event.head_commit.message != 'Attach Job Invitation UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach portal scripts and design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=False
          items=(
              ('index.html','<link rel="stylesheet" href="naukri-style.css">'),
              ('hr.html','<script src="job-invitations.js"></script>'),
              ('hr.html','<script src="hr-employee-profiles.js"></script>'),
              ('hr.html','<script src="auth-guard.js"></script>'),
              ('hr.html','<link rel="stylesheet" href="naukri-style.css">'),
              ('seeker.html','<script src="job-invitations.js"></script>'),
              ('seeker.html','<script src="employee-notifications.js"></script>'),
              ('seeker.html','<script src="auth-guard.js"></script>'),
              ('seeker.html','<link rel="stylesheet" href="naukri-style.css">'))
          for name,tag in items:
              p=Path(name)
              s=p.read_text()
              if tag not in s:
                  if tag.startswith('<link '): s=s.replace('</head>',tag+'</head>',1)
                  else: s=s.replace('</body>',tag+'</body>',1)
                  p.write_text(s)
                  changed=True
          print('changed=',changed)
          PY
      - name: Commit attachment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hr.html seeker.html
          git diff --cached --quiet || git commit -m 'Attach Job Invitation UI'
          git push
