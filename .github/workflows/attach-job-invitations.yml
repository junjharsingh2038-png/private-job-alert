name: Attach Portal Assets
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: portal-assets-main
  cancel-in-progress: true
jobs:
  attach:
    if: github.event.head_commit.message != 'Attach Portal Assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach portal scripts and styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          items={
            'index.html':[
              '<link rel="stylesheet" href="naukri-style.css?v=20260907">','<link rel="stylesheet" href="company-logo.css?v=20260907">','<link rel="stylesheet" href="professional-job-description.css?v=20260907">','<link rel="stylesheet" href="job-details.css?v=20260907">','<link rel="stylesheet" href="compact-filters.css?v=20260907">','<script src="company-logo.js?v=20260907"></script>','<script src="job-details.js?v=20260907"></script>'],
            'hr.html':[
              '<script src="job-invitations.js?v=20260907"></script>','<script src="hr-employee-profiles.js?v=20260907"></script>','<script src="auth-guard.js?v=20260907"></script>','<script src="password-reset-otp.js?v=20260907"></script>','<link rel="stylesheet" href="naukri-style.css?v=20260907">','<link rel="stylesheet" href="company-logo.css?v=20260907">','<link rel="stylesheet" href="professional-job-description.css?v=20260907">','<link rel="stylesheet" href="job-details.css?v=20260907">','<link rel="stylesheet" href="compact-filters.css?v=20260907">','<link rel="stylesheet" href="password-reset-otp.css?v=20260907">','<script src="company-logo.js?v=20260907"></script>','<script src="job-details.js?v=20260907"></script>'],
            'seeker.html':[
              '<script src="job-invitations.js?v=20260907"></script>','<script src="employee-notifications.js?v=20260907"></script>','<script src="auth-guard.js?v=20260907"></script>','<script src="password-reset-otp.js?v=20260907"></script>','<script src="employee-registration-fix.js?v=20260907"></script>','<link rel="stylesheet" href="naukri-style.css?v=20260907">','<link rel="stylesheet" href="company-logo.css?v=20260907">','<link rel="stylesheet" href="professional-job-description.css?v=20260907">','<link rel="stylesheet" href="compact-filters.css?v=20260907">','<link rel="stylesheet" href="password-reset-otp.css?v=20260907">','<script src="company-logo.js?v=20260907"></script>','<script src="job-details.js?v=20260907"></script>'],
            'admin.html':[
              '<script src="auth-guard.js?v=20260907"></script>','<script src="password-reset-otp.js?v=20260907"></script>','<link rel="stylesheet" href="password-reset-otp.css?v=20260907">']}
          for name,tags in items.items():
            p=Path(name);s=p.read_text()
            bases=['naukri-style.css','company-logo.css','professional-job-description.css','job-details.css','compact-filters.css','password-reset-otp.css']
            for base in bases:
              s=re.sub(r'<link\s+rel="stylesheet"\s+href="'+re.escape(base)+r'(?:\?v=[^"]+)?"\s*/?>','',s)
            for base in ['job-invitations.js','hr-employee-profiles.js','employee-notifications.js','auth-guard.js','password-reset-otp.js','employee-registration-fix.js','company-logo.js','job-details.js','employee-signup-otp.js']:
              s=re.sub(r'<script\s+src="'+re.escape(base)+r'(?:\?v=[^"]+)?"\s*></script>','',s)
            s=re.sub(r'<link rel="stylesheet" href="job-details\.js">','',s)
            for tag in tags:
              s=s.replace('</body>',tag+'</body>',1)
            p.write_text(s)
          PY
      - name: Validate required OTP assets
        run: |
          test -s password-reset-otp.js
          test -s password-reset-otp.css
          grep -q 'password-reset-otp.js?v=20260907' hr.html
          grep -q 'password-reset-otp.js?v=20260907' seeker.html
          grep -q 'password-reset-otp.js?v=20260907' admin.html
      - name: Commit attachment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hr.html seeker.html admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'Attach Portal Assets'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
