name: Attach Job Invitations
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  attach:
    if: github.event.head_commit.message != 'Attach Job Invitation UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach invitation and notification scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=False
          for name,tag in (
              ('hr.html','<script src="job-invitations.js"></script>'),
              ('seeker.html','<script src="job-invitations.js"></script>'),
              ('seeker.html','<script src="employee-notifications.js"></script>')):
              p=Path(name)
              s=p.read_text()
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>',1)
                  p.write_text(s)
                  changed=True
          print('changed=',changed)
          PY
      - name: Commit attachment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hr.html seeker.html
          git diff --cached --quiet || git commit -m 'Attach Job Invitation UI'
          git push
