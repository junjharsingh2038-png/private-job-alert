name: Attach Job Invitations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-job-invitations.yml'
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach invitation script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('hr.html','seeker.html'):
              p=Path(name)
              s=p.read_text()
              tag='<script src="job-invitations.js"></script>'
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>')
                  p.write_text(s)
          PY
      - name: Commit pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hr.html seeker.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable job invitations in HR and employee portals'
          git push