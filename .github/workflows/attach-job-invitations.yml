name: Unified Portal Assets
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portal-assets-main
  cancel-in-progress: true
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Sync portal assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync required portal assets
        env:
          VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          v=os.environ['VERSION']
          assets={
            'index.html':[
              ('css','naukri-style.css'),('css','company-logo.css'),('css','professional-job-description.css'),('css','job-details.css'),('css','compact-filters.css'),('css','job-share.css'),('css','job-view.css'),
              ('js','company-logo.js'),('js','job-details.js'),('js','job-share.js'),('js','job-view.js'),('js','goatcounter.js')],
            'hr.html':[
              ('js','job-invitations.js'),('js','hr-employee-profiles.js'),('js','auth-guard.js'),('js','password-reset-otp.js'),('js','goatcounter.js'),
              ('css','naukri-style.css'),('css','company-logo.css'),('css','professional-job-description.css'),('css','job-details.css'),('css','compact-filters.css'),('css','password-reset-otp.css'),
              ('js','company-logo.js'),('js','job-details.js')],
            'seeker.html':[
              ('js','job-invitations.js'),('js','employee-notifications.js'),('js','auth-guard.js'),('js','password-reset-otp.js'),('js','employee-registration-fix.js'),('js','goatcounter.js'),
              ('css','naukri-style.css'),('css','company-logo.css'),('css','professional-job-description.css'),('css','compact-filters.css'),('css','password-reset-otp.css'),
              ('js','company-logo.js'),('js','job-details.js')],
            'admin.html':[
              ('js','auth-guard.js'),('js','password-reset-otp.js'),('js','admin-reports.js'),
              ('css','password-reset-otp.css'),('css','admin-reports.css'),('css','admin-design.css')]
          }
          for name,items in assets.items():
            p=Path(name); s=p.read_text()
            for typ,base in items:
              b=re.escape(base)
              if typ=='js':
                s=re.sub(r'<script\s+src=["\']'+b+r'(?:\?[^"\']*)?["\']\s*></script>\s*','',s,flags=re.I)
              else:
                s=re.sub(r'<link\s+rel=["\']stylesheet["\']\s+href=["\']'+b+r'(?:\?[^"\']*)?["\']\s*/?>\s*','',s,flags=re.I)
            tags=[]
            for typ,base in items:
              tags.append((f'<script src="{base}?v={v}"></script>' if typ=='js' else f'<link rel="stylesheet" href="{base}?v={v}">'))
            s=s.replace('</body>', ''.join(tags)+'</body>', 1)
            p.write_text(s)
          PY
      - name: Validate managed assets
        run: |
          test -s password-reset-otp.js
          test -s password-reset-otp.css
          test -s auth-guard.js
          test -s employee-registration-fix.js
          test -s admin-reports.js
          test -s admin-reports.css
          test -s admin-design.css
          test -s goatcounter.js
          test -s job-share.js
          test -s job-share.css
          test -s job-view.js
          test -s job-view.css
          python3 - <<'PY'
          from pathlib import Path
          checks={
            'hr.html':['password-reset-otp.js','password-reset-otp.css','auth-guard.js','goatcounter.js'],
            'seeker.html':['password-reset-otp.js','password-reset-otp.css','auth-guard.js','employee-registration-fix.js','goatcounter.js'],
            'admin.html':['password-reset-otp.js','password-reset-otp.css','auth-guard.js','admin-reports.js','admin-reports.css','admin-design.css'],
            'index.html':['company-logo.js','job-details.js','job-share.js','job-share.css','job-view.js','job-view.css','goatcounter.js']}
          for f,need in checks.items():
            s=Path(f).read_text()
            for x in need: assert x in s, f'{x} missing from {f}'
            assert 'href="job-details.js"' not in s, f'bad stylesheet reference in {f}'
          print('Portal asset validation passed')
          PY
      - name: Commit synced pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hr.html seeker.html admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'Sync portal assets'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
