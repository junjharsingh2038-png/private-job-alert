name: Google Job Indexing

on:
  workflow_dispatch:
  # Daily automatic submission avoids repeatedly spending API quota on every deployment.
  # Run once daily; Google Indexing API has strict daily quotas.
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: read

jobs:
  indexing:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submit JobPosting URLs to Google Indexing API
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON secret is missing or empty."
            exit 1
          fi

          python -m pip install --quiet google-auth requests
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/google-service-account.json

          python - <<'PY'
          import json, pathlib, sys, re, xml.etree.ElementTree as ET
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          import requests

          key_path = pathlib.Path('/tmp/google-service-account.json')
          data = json.loads(key_path.read_text())
          creds = service_account.Credentials.from_service_account_info(
              data,
              scopes=['https://www.googleapis.com/auth/indexing'],
          )
          session = AuthorizedSession(creds)

          base = 'https://junjharsingh2038-png.github.io/private-job-alert'
          sitemap = pathlib.Path('sitemap.xml')
          if not sitemap.is_file():
              print('::error::sitemap.xml is missing.')
              sys.exit(1)
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ET.parse(sitemap).getroot()
          entries = []
          for item in root.findall('sm:url', ns):
              loc = item.findtext('sm:loc', default='', namespaces=ns)
              lastmod = item.findtext('sm:lastmod', default='', namespaces=ns)
              # Only individual vacancy pages qualify for JobPosting notifications.
              # Exclude /jobs/ listing page and all non-job URLs.
              if re.fullmatch(re.escape(base) + r'/jobs/[a-z0-9-]+/', loc):
                  entries.append((lastmod, loc))
          entries.sort(reverse=True)
          urls = [url for _, url in entries[:150]]

          print(f'Found {len(entries)} individual JobPosting URLs; checking newest {len(urls)} after deployment.')
          if not urls:
              print('::error::No jobs/*/index.html pages found; nothing was submitted.')
              sys.exit(1)

          failed = 0
          for url in urls:
              try:
                  page = requests.get(url, timeout=30, headers={'User-Agent': 'PrivateJobAlert-SEO-Validator/1.0'})
                  if page.status_code != 200:
                      failed += 1
                      print(f'::error::PAGE NOT LIVE {page.status_code} {url}')
                      continue
                  if '"@type": "JobPosting"' not in page.text and '"@type":"JobPosting"' not in page.text:
                      failed += 1
                      print(f'::error::MISSING JOBPOSTING SCHEMA {url}')
                      continue
                  response = session.post(
                      'https://indexing.googleapis.com/v3/urlNotifications:publish',
                      json={'url': url, 'type': 'URL_UPDATED'},
                      timeout=30,
                  )
                  if response.ok:
                      print(f'ACCEPTED {response.status_code} {url}')
                  else:
                      failed += 1
                      print(f'::error::REJECTED {response.status_code} {url}')
                      print(response.text[:2000])
              except Exception as exc:
                  failed += 1
                  print(f'::error::REQUEST FAILED {url}: {exc}')

          print(f'Submission summary: {len(urls) - failed} accepted, {failed} failed.')
          if failed:
              sys.exit(1)
          PY
