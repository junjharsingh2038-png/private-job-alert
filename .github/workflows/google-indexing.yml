name: Google Job Indexing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jobs/**'
      - 'sitemap.xml'
  # The SEO generator runs hourly and commits pages with GITHUB_TOKEN.
  # Scheduled indexing ensures those generated pages are submitted even when
  # GitHub does not trigger a second workflow from that bot commit.
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: read

jobs:
  indexing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submit JobPosting URLs to Google Indexing API
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON secret is missing or empty."
            exit 1
          fi

          python -m pip install --quiet google-auth requests
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/google-service-account.json

          python - <<'PY'
          import json, pathlib, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          key_path = pathlib.Path('/tmp/google-service-account.json')
          data = json.loads(key_path.read_text())
          creds = service_account.Credentials.from_service_account_info(
              data,
              scopes=['https://www.googleapis.com/auth/indexing'],
          )
          session = AuthorizedSession(creds)

          root = pathlib.Path('jobs')
          urls = sorted({
              'https://junjharsingh2038-png.github.io/private-job-alert/jobs/' + p.parent.name + '/'
              for p in root.glob('*/index.html')
          }) if root.exists() else []

          print(f'Found {len(urls)} JobPosting URLs.')
          if not urls:
              print('::error::No jobs/*/index.html pages found; nothing was submitted.')
              sys.exit(1)

          failed = 0
          for url in urls:
              try:
                  response = session.post(
                      'https://indexing.googleapis.com/v3/urlNotifications:publish',
                      json={'url': url, 'type': 'URL_UPDATED'},
                      timeout=30,
                  )
                  if response.ok:
                      print(f'ACCEPTED {response.status_code} {url}')
                  else:
                      failed += 1
                      print(f'::error::REJECTED {response.status_code} {url}')
                      print(response.text[:2000])
              except Exception as exc:
                  failed += 1
                  print(f'::error::REQUEST FAILED {url}: {exc}')

          print(f'Submission summary: {len(urls) - failed} accepted, {failed} failed.')
          if failed:
              sys.exit(1)
          PY
