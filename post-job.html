<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post New Job | Private Job Alert HR</title>
<meta name="robots" content="noindex,follow">
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f8fc;color:#17243a}.wrap{max-width:850px;margin:35px auto;padding:0 18px}.card{background:#fff;border:1px solid #dce5f0;border-radius:20px;padding:28px;box-shadow:0 8px 25px #10264a12}.brand{color:#1264e8;font-weight:800;text-decoration:none}.form{display:grid;gap:14px;margin-top:22px}.form label{font-weight:700}.form input,.form textarea,.form select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd7e5;border-radius:10px;font:inherit;margin-top:6px}button,.btn{display:inline-block;border:0;background:#1264e8;color:#fff;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#fff;color:#1264e8;border:1px solid #1264e8}.msg{min-height:22px;font-weight:700}.danger{color:#c62828}.success{color:#087a36}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
</style>
</head>
<body><div class="wrap"><div class="card">
<div class="top"><a class="brand" href="hr.html">💼 PRIVATE JOB ALERT – HR</a><a href="hr.html" target="_blank" rel="noopener">HR Dashboard ↗</a></div>
<h1>Post New Job</h1><p>Create and publish your vacancy across Private Job Alert.</p>
<div id="authMsg" class="msg"></div>
<form id="jobForm" class="form hidden">
<label>Job Title<input name="title" required></label>
<label>Company Name<input name="company" id="company" required></label>
<label>Location (Any City / State in India)<input name="location" placeholder="Jaipur, Rajasthan / Mumbai, Maharashtra / Delhi" required></label>
<label>Qualification<input name="qualification"></label>
<label>Salary<input name="salary"></label>
<label>Job Type<select name="job_type"><option>Full Time</option><option>Part Time</option><option>Work From Home</option><option>Internship</option><option>Contract</option></select></label>
<label>Job Description<textarea name="description" rows="8"></textarea></label>
<button type="submit">Publish Job</button>
<p id="jobMsg" class="msg"></p>
</form>
<div id="loginBox" class="hidden"><p>Please login with your HR account first.</p><div class="actions"><a class="btn" href="hr.html" target="_blank" rel="noopener">HR Login ↗</a><a class="btn secondary" href="index.html" target="_blank" rel="noopener">Home ↗</a></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient('https://rlidcatrwonemshwzafp.supabase.co','sb_publishable_ocJhWyfPg9rVhYROn_Vj0Q_DSSgxeuE');
const $=id=>document.getElementById(id);let user=null;
async function init(){const r=await sb.auth.getUser();user=r.data?.user||null;if(!user){$('loginBox').classList.remove('hidden');$('authMsg').textContent='HR login required.';return}$('jobForm').classList.remove('hidden');$('company').value=user.user_metadata?.company||''}
$('jobForm').onsubmit=async e=>{e.preventDefault();if(!user)return;const f=new FormData(e.target),c=f.get('company');$('jobMsg').textContent='Publishing job...';const r=await sb.from('jobs').insert({hr_user_id:user.id,user_id:user.id,owner_id:user.id,hr_email:user.email,title:f.get('title'),company:c,company_name:c,location:f.get('location'),qualification:f.get('qualification'),salary:f.get('salary'),job_type:f.get('job_type'),type:f.get('job_type'),description:f.get('description'),is_active:true});if(r.error){$('jobMsg').textContent=r.error.message;$('jobMsg').className='msg danger';return}$('jobMsg').textContent='Job published successfully.';$('jobMsg').className='msg success';e.target.reset();$('company').value=user.user_metadata?.company||''};
init();
</script></body></html>
