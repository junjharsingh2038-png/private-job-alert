<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Portal | Private Job Alert Rajasthan</title>
<link rel="stylesheet" href="style.css">
<style>
.hr-page{min-height:100vh}.hr-wrap{max-width:1100px;margin:30px auto;padding:20px}.hr-card{background:#fff;border:1px solid #dce5f0;border-radius:18px;padding:30px;box-shadow:0 8px 28px #10264a12}.tabs,.hr-actions{display:flex;gap:10px;flex-wrap:wrap}.tabs button{flex:1}.secondary{background:#fff;color:#1264e8;border:1px solid #1264e8}.hidden{display:none!important}.msg{margin-top:12px;font-weight:600}.success{color:#087a36}.danger{color:#c62828}.hr-actions button{flex:1}.job{border:1px solid #e2e9f2;border-radius:12px;padding:15px;margin:10px 0;background:#fbfdff}.info-section{margin-top:28px}.info-grid,.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.info-card,.step{background:#fbfdff;border:1px solid #dce5f0;border-radius:14px;padding:20px;cursor:pointer;transition:.2s}.info-card:hover,.step:hover{border-color:#1264e8;box-shadow:0 6px 18px #10264a12;transform:translateY(-1px)}.info-card h3,.step h3{margin:10px 0}.info-card p,.step p{color:#63728a;line-height:1.5}.info-link{color:#1264e8;font-weight:700}.card-detail{margin-top:15px;padding:15px;background:#eef6ff;border:1px solid #cfe1fa;border-radius:10px;line-height:1.55}.count{display:inline-flex;min-width:28px;height:28px;padding:0 8px;align-items:center;justify-content:center;border-radius:20px;background:#e9f3ff;color:#1264e8;font-size:14px}.danger-btn{color:#c62828;background:#fff;border:1px solid #efb7b7}.brand{font-weight:800}textarea{width:100%;box-sizing:border-box}.search-box{display:flex;gap:10px;margin:12px 0}.search-box input{flex:1;padding:12px;border:1px solid #cfdbea;border-radius:8px}@media(max-width:750px){.info-grid,.steps{grid-template-columns:1fr}.hr-wrap{padding:12px}.hr-card{padding:20px}}
</style>
</head>
<body class="hr-page">
<header><div class="brand">💼 PRIVATE JOB ALERT RAJASTHAN</div><nav><a href="index.html">Job Seekers</a></nav></header>
<main class="hr-wrap">
<section id="authCard" class="hr-card">
<span class="hr-badge">HR / EMPLOYER PORTAL</span><h1 id="heading">HR Login</h1><p id="subheading">Login करके अपनी vacancies और applications manage करें।</p>
<div class="tabs"><button id="loginTab">HR Login</button><button id="registerTab" class="secondary">Register New HR</button></div>
<form id="authForm" class="form"><label id="nameField" class="hidden">HR Name<input name="hr_name" autocomplete="name"></label><label id="companyField" class="hidden">Company Name<input name="company" autocomplete="organization"></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="6" autocomplete="current-password" required></label><button id="submitBtn" type="submit">Login</button><p id="authMsg" class="msg"></p></form>
</section>
<section id="dashboard" class="hr-card hidden"></section>
</main><footer>© 2026 Private Job Alert Rajasthan · HR Employer Portal</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
<script>
(function(){
let mode='login';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function setMode(m){mode=m;const reg=m==='register';$('heading').textContent=reg?'Register New HR':'HR Login';$('subheading').textContent=reg?'नया HR account बनाने के लिए HR Name, Company, Email और Password भरें।':'Login करके अपनी vacancies और applications manage करें।';$('nameField').classList.toggle('hidden',!reg);$('companyField').classList.toggle('hidden',!reg);$('nameField input').required=reg;$('companyField input').required=reg;$('submitBtn').textContent=reg?'Create HR Account':'Login';$('loginTab').classList.toggle('secondary',reg);$('registerTab').classList.toggle('secondary',!reg);$('authMsg').textContent=''}
$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');
$('authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')||'').trim().toLowerCase(),password=String(f.get('password')||''),msg=$('authMsg');msg.className='msg';msg.textContent='Please wait...';try{let r;if(mode==='register'){const name=String(f.get('hr_name')||'').trim(),company=String(f.get('company')||'').trim();if(!name||!company){msg.className='msg danger';msg.textContent='HR Name और Company Name भरना जरूरी है।';return}r=await sb.auth.signUp({email,password,options:{data:{hr_name:name,company:company}}})}else r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(mode==='register'&&!r.data.session){msg.className='msg success';msg.textContent='Account created. Email verify करके Login करें।'}else{msg.className='msg success';msg.textContent='Login successful...';setTimeout(showDashboard,200)}}catch(err){msg.className='msg danger';msg.textContent=err?.message||'Registration/Login failed.'}};
async function getUser(){const r=await sb.auth.getUser();return r.data?.user||null}
async function showDashboard(){const user=await getUser();if(!user){setMode('login');return}const meta=user.user_metadata||{};$('authCard').classList.add('hidden');$('dashboard').classList.remove('hidden');$('dashboard').innerHTML='<span class="hr-badge">HR / EMPLOYER PORTAL</span><h1>Welcome, '+esc(meta.hr_name||meta.company||'HR')+'</h1><p>Logged in as <b>'+esc(user.email||'')+'</b></p><div class="hr-actions"><button id="postBtn">+ Post New Job</button><button id="logoutBtn" class="secondary">Logout</button></div><div id="dashContent">Loading...</div><div id="infoSections"></div>';$('postBtn').onclick=showPost;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};await loadDashboard();renderInfoSections()}
async function loadDashboard(){const user=await getUser();if(!user)return;const jr=await sb.from('jobs').select('*').eq('hr_user_id',user.id).order('created_at',{ascending:false});const ar=await sb.from('applications').select('*').eq('hr_email',user.email).order('created_at',{ascending:false});const jobs=jr.data||[],apps=ar.data||[];const content=$('dashContent');content.innerHTML='<section id="postedJobsSection" class="info-section hidden"><h2>My Posted Jobs <span class="count">'+jobs.length+'</span></h2>'+(jobs.length?jobs.map(j=>'<div class="job"><b>'+esc(j.title)+'</b><br>'+esc(j.company||j.company_name||'')+' · '+esc(j.location||'')+'<br><small>'+(j.is_active===false?'Inactive':'Active')+'</small> <button class="danger-btn" data-delete="'+esc(j.id)+'">Delete</button></div>').join(''):'<p>No jobs posted yet.</p>')+'</section><section id="applicationsSection" class="info-section hidden"><h2>Applications Received <span class="count">'+apps.length+'</span></h2>'+(apps.length?apps.map(a=>'<div class="job"><b>'+esc(a.candidate_name)+'</b><br>📱 '+esc(a.candidate_mobile)+' · ✉️ '+esc(a.candidate_email)+'<br>🎓 '+esc(a.qualification||'Not specified')+' · 💼 '+esc(a.experience||'Fresher')+'<br><small>'+new Date(a.created_at).toLocaleString()+'</small></div>').join(''):'<p>No applications received yet.</p>')+'</section><section id="candidateSection" class="info-section hidden"></section>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this job?')){await sb.from('jobs').delete().eq('id',b.dataset.delete).eq('hr_user_id',user.id);loadDashboard()}})}
function scrollTo(id){const el=$(id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'})}}
function renderInfoSections(){const root=$('infoSections');root.innerHTML='<section class="info-section"><h2>Why HRs Should Post Here</h2><div class="info-grid"><article class="info-card" data-card="free"><b>01</b><h3>Free Job Posting</h3><p>Private-sector vacancy free में post करें।</p><span class="info-link">Click to open →</span></article><article class="info-card" data-card="reach"><b>02</b><h3>Reach Candidates</h3><p>Suitable candidates तक अपनी vacancy पहुँचाएँ।</p><span class="info-link">Click to open →</span></article><article class="info-card" data-card="direct"><b>03</b><h3>Direct Applications</h3><p>Applications सीधे इसी HR dashboard में देखें।</p><span class="info-link">Click to open →</span></article></div></section><section class="info-section"><h2>How HR Job Posting Works</h2><div class="steps"><article class="step" data-card="account"><span class="step-number">1</span><h3>Create Account</h3><p>नए HR के लिए account बनाएँ।</p><span class="info-link">Click to open →</span></article><article class="step" data-card="post"><span class="step-number">2</span><h3>Post Vacancy</h3><p>अपनी vacancy publish करें।</p><span class="info-link">Click to open →</span></article><article class="step" data-card="receive"><span class="step-number">3</span><h3>Applications Received</h3><p>प्राप्त applications इसी dashboard में देखें।</p><span class="info-link">Click to open →</span></article></div></section>';
root.querySelectorAll('[data-card]').forEach(card=>card.addEventListener('click',()=>handleCard(card.dataset.card)))}
async function handleCard(key){
if(key==='free'){showPost();return}
if(key==='reach'){showCandidates();return}
if(key==='direct'||key==='receive'){await loadDashboard();const s=$('applicationsSection');if(s)s.classList.remove('hidden');scrollTo('applicationsSection');return}
if(key==='account'){ $('dashboard').classList.add('hidden');$('authCard').classList.remove('hidden');setMode('register');scrollTo('authCard');return }
if(key==='post'){showPost();return}
}
function showPost(){$('dashContent').innerHTML='<section id="postSection"><h2>Post New Job</h2><p>Job posting यहीं इसी page पर खुलेगी।</p><form id="jobForm" class="form"><label>Job Title<input name="title" required></label><label>Company Name<input name="company" required></label><label>Location<input name="location" required></label><label>Qualification<input name="qualification"></label><label>Salary<input name="salary"></label><label>Job Type<input name="job_type" value="Full Time"></label><label>Last Date<input name="lastdate" placeholder="DD-MM-YYYY"></label><label>Job Description<textarea name="description" rows="5"></textarea></label><div class="hr-actions"><button type="submit">Publish Job</button><button type="button" id="backBtn" class="secondary">Back to Dashboard</button></div><p id="jobMsg" class="msg"></p></form></section>';$('backBtn').onclick=loadDashboard;$('jobForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),user=await getUser(),msg=$('jobMsg');if(!user){msg.className='msg danger';msg.textContent='Please login again.';return}const company=f.get('company'),x=await sb.from('jobs').insert({hr_user_id:user.id,user_id:user.id,owner_id:user.id,hr_email:user.email,title:f.get('title'),company,company_name:company,location:f.get('location'),qualification:f.get('qualification'),salary:f.get('salary'),job_type:f.get('job_type'),type:f.get('job_type'),lastdate:f.get('lastdate')||null,description:f.get('description'),is_active:true});if(x.error){msg.className='msg danger';msg.textContent=x.error.message;return}msg.className='msg success';msg.textContent='Job published successfully.';setTimeout(loadDashboard,500)}}
async function showCandidates(){const user=await getUser();if(!user)return;const ar=await sb.from('applications').select('*').eq('hr_email',user.email).order('created_at',{ascending:false});const apps=ar.data||[];const sec=$('candidateSection');sec.classList.remove('hidden');sec.innerHTML='<h2>Reach Candidates</h2><p>Candidate की qualification, experience और location के आधार पर यहाँ search/shortlist करें।</p><div class="search-box"><input id="candidateSearch" placeholder="Name, qualification, experience या location search करें"><button id="candidateSearchBtn">Search</button></div><div id="candidateResults"></div>';renderCandidateResults(apps,'');$('candidateSearchBtn').onclick=()=>renderCandidateResults(apps,$('candidateSearch').value);$('candidateSearch').oninput=()=>renderCandidateResults(apps,$('candidateSearch').value);scrollTo('candidateSection')}
function renderCandidateResults(apps,q){q=String(q||'').toLowerCase().trim();const list=apps.filter(a=>!q||[a.candidate_name,a.candidate_location,a.qualification,a.experience,a.candidate_email].some(v=>String(v||'').toLowerCase().includes(q)));$('candidateResults').innerHTML=list.length?list.map(a=>'<div class="job"><b>'+esc(a.candidate_name)+'</b><br>📱 '+esc(a.candidate_mobile)+' · ✉️ '+esc(a.candidate_email)+'<br>📍 '+esc(a.candidate_location||'Not specified')+' · 🎓 '+esc(a.qualification||'Not specified')+' · 💼 '+esc(a.experience||'Fresher')+'</div>').join(''):'<p>No matching candidates found.</p>'}
setMode('login');sb.auth.getUser().then(r=>{if(r.data?.user)showDashboard()});
})();
</script></body></html>
