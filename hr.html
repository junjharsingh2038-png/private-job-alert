<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Register | Private Job Alert Rajasthan</title>
<link rel="stylesheet" href="style.css">
<style>
.hr-page{min-height:100vh}.hr-wrap{max-width:620px;margin:50px auto;padding:20px}.hr-card{background:#fff;border:1px solid #dce5f0;border-radius:18px;padding:30px;box-shadow:0 8px 28px #10264a12}.tabs{display:flex;gap:10px;margin:20px 0}.tabs button{flex:1}.secondary{background:#fff;color:#1264e8;border:1px solid #1264e8}.hidden{display:none!important}.msg{margin-top:12px;font-weight:600}.success{color:#087a36}.danger{color:#c62828}.hr-actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.hr-actions button{flex:1}.job{border:1px solid #e2e9f2;border-radius:12px;padding:15px;margin:10px 0;background:#fbfdff}.back{margin-bottom:20px}.brand{font-weight:800}textarea{width:100%;box-sizing:border-box}
</style>
</head>
<body class="hr-page">
<header><div class="brand">💼 PRIVATE JOB ALERT RAJASTHAN</div><nav><a href="index.html">Job Seekers</a></nav></header>
<main class="hr-wrap">
<section id="authCard" class="hr-card">
<span class="hr-badge">HR / EMPLOYER PORTAL</span>
<h1 id="heading">HR Login</h1>
<p id="subheading">Login करके अपनी vacancies और applications manage करें।</p>
<div class="tabs"><button id="loginTab">HR Login</button><button id="registerTab" class="secondary">Register New HR</button></div>
<form id="authForm" class="form">
<label id="nameField" class="hidden">HR Name<input name="hr_name" autocomplete="name"></label>
<label id="companyField" class="hidden">Company Name<input name="company" autocomplete="organization"></label>
<label>Email<input name="email" type="email" autocomplete="email" required></label>
<label>Password<input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
<button id="submitBtn" type="submit">Login</button>
<p id="authMsg" class="msg"></p>
</form>
</section>
<section id="dashboard" class="hr-card hidden"></section>
</main>
<footer>© 2026 Private Job Alert Rajasthan · HR Employer Portal</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
(function(){
  let mode='login';
  const $=id=>document.getElementById(id);
  function setMode(m){
    mode=m;
    const reg=m==='register';
    $('heading').textContent=reg?'Register New HR':'HR Login';
    $('subheading').textContent=reg?'नया HR account बनाने के लिए नीचे की जानकारी भरें।':'Login करके अपनी vacancies और applications manage करें।';
    $('nameField').classList.toggle('hidden',!reg);
    $('companyField').classList.toggle('hidden',!reg);
    $('nameField').querySelector('input').required=reg;
    $('companyField').querySelector('input').required=reg;
    $('submitBtn').textContent=reg?'Create HR Account':'Login';
    $('loginTab').classList.toggle('secondary',reg);
    $('registerTab').classList.toggle('secondary',!reg);
    $('authMsg').textContent='';
    $('authMsg').className='msg';
  }
  $('loginTab').addEventListener('click',function(){setMode('login')});
  $('registerTab').addEventListener('click',function(){setMode('register')});
  $('authForm').addEventListener('submit',async function(e){
    e.preventDefault();
    const f=new FormData(e.target),email=String(f.get('email')||'').trim().toLowerCase(),password=String(f.get('password')||''),msg=$('authMsg');
    msg.className='msg';msg.textContent='Please wait...';
    try{
      let r;
      if(mode==='register'){
        const name=String(f.get('hr_name')||'').trim(),company=String(f.get('company')||'').trim();
        if(!name||!company){msg.className='msg danger';msg.textContent='HR Name और Company Name भरना जरूरी है।';return;}
        r=await sb.auth.signUp({email,password,options:{data:{hr_name:name,company:company}}});
      }else{
        r=await sb.auth.signInWithPassword({email,password});
      }
      if(r.error)throw r.error;
      if(mode==='register'){
        if(r.data && r.data.user && r.data.session){
          msg.className='msg success';msg.textContent='Registration successful. Dashboard खोल रहा हूँ...';
          setTimeout(showDashboard,300);
        }else{
          msg.className='msg success';msg.textContent='Registration successful. अगर email confirmation मांगा जाए तो email verify करके इसी page पर Login करें।';
        }
      }else{
        msg.className='msg success';msg.textContent='Login successful...';
        setTimeout(showDashboard,200);
      }
    }catch(err){msg.className='msg danger';msg.textContent=err&&err.message?err.message:'Registration/Login failed.';}
  });
  async function showDashboard(){
    const result=await sb.auth.getUser(),user=result.data&&result.data.user;
    if(!user){setMode('login');return;}
    $('authCard').classList.add('hidden');$('dashboard').classList.remove('hidden');
    const meta=user.user_metadata||{};
    $('dashboard').innerHTML='<span class="hr-badge">HR / EMPLOYER PORTAL</span><h1>Welcome, '+esc(meta.hr_name||meta.company||'HR')+'</h1><p>Logged in as <b>'+esc(user.email||'')+'</b></p><div class="hr-actions"><button id="postBtn">+ Post New Job</button><button id="logoutBtn" class="secondary">Logout</button></div><div id="dashContent">Loading...</div>';
    $('postBtn').onclick=showPost;
    $('logoutBtn').onclick=async function(){await sb.auth.signOut();location.reload()};
    await loadDashboard();
  }
  async function loadDashboard(){
    const result=await sb.auth.getUser(),user=result.data&&result.data.user;if(!user)return;
    const jobsResult=await sb.from('jobs').select('*').eq('hr_user_id',user.id).order('created_at',{ascending:false});
    const appsResult=await sb.from('applications').select('*').eq('hr_email',user.email).order('created_at',{ascending:false});
    const jobs=jobsResult.data||[],apps=appsResult.data||[];
    $('dashContent').innerHTML='<h2>My Posted Jobs ('+jobs.length+')</h2>'+ (jobs.length?jobs.map(j=>'<div class="job"><b>'+esc(j.title)+'</b><br>'+esc(j.company||j.company_name||'')+' · '+esc(j.location||'')+'<br><small>'+(j.is_active===false?'Inactive':'Active')+'</small> <button class="danger-btn" data-delete="'+esc(j.id)+'">Delete</button></div>').join(''):'<p>No jobs posted yet.</p>')+'<h2>Applications Received ('+apps.length+')</h2>'+ (apps.length?apps.map(a=>'<div class="job"><b>'+esc(a.candidate_name)+'</b><br>📱 '+esc(a.candidate_mobile)+' · ✉️ '+esc(a.candidate_email)+'<br>🎓 '+esc(a.qualification||'Not specified')+' · 💼 '+esc(a.experience||'Fresher')+'</div>').join(''):'<p>No applications received yet.</p>');
    document.querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=async function(){if(!confirm('Delete this job?'))return;await sb.from('jobs').delete().eq('id',btn.dataset.delete).eq('hr_user_id',user.id);loadDashboard()});
  }
  function showPost(){
    $('dashContent').innerHTML='<h2>Post New Job</h2><form id="jobForm" class="form"><label>Job Title<input name="title" required></label><label>Company Name<input name="company" required></label><label>Location<input name="location" required></label><label>Qualification<input name="qualification"></label><label>Salary<input name="salary"></label><label>Job Type<input name="job_type" value="Full Time"></label><label>Last Date<input name="lastdate" placeholder="DD-MM-YYYY"></label><label>Job Description<textarea name="description" rows="5"></textarea></label><div class="hr-actions"><button type="submit">Publish Job</button><button type="button" id="backBtn" class="secondary">Back</button></div><p id="jobMsg" class="msg"></p></form>';
    $('backBtn').onclick=loadDashboard;
    $('jobForm').onsubmit=async function(e){e.preventDefault();const f=new FormData(e.target),r=await sb.auth.getUser(),user=r.data&&r.data.user,msg=$('jobMsg');if(!user){msg.className='msg danger';msg.textContent='Please login again.';return;}const company=f.get('company');const x=await sb.from('jobs').insert({hr_user_id:user.id,user_id:user.id,owner_id:user.id,hr_email:user.email,title:f.get('title'),company:company,company_name:company,location:f.get('location'),qualification:f.get('qualification'),salary:f.get('salary'),job_type:f.get('job_type'),type:f.get('job_type'),lastdate:f.get('lastdate')||null,description:f.get('description'),is_active:true});if(x.error){msg.className='msg danger';msg.textContent=x.error.message;return;}msg.className='msg success';msg.textContent='Job published successfully.';setTimeout(loadDashboard,500)};
  }
  function esc(v){return String(v??'').replace(/[&<>\"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]})}
  setMode('login');
  sb.auth.getUser().then(function(r){if(r.data&&r.data.user)showDashboard()});
})();
</script>
</body>
</html>
