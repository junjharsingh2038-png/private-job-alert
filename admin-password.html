<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Password OTP | Private Job Alert</title><meta name="robots" content="noindex,nofollow"><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#17243a}.wrap{max-width:520px;margin:55px auto;padding:20px}.box{background:#fff;border:1px solid #dce5f0;border-radius:20px;padding:28px;box-shadow:0 12px 35px rgba(20,50,90,.1)}h1{margin-top:0}.badge{display:inline-block;padding:7px 12px;border-radius:20px;background:#eaf2ff;color:#1264e8;font-size:11px;font-weight:800}form{display:grid;gap:14px;margin-top:20px}label{font-weight:700}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd7e5;border-radius:10px;font-size:16px}button{padding:13px;border:0;border-radius:10px;background:#1264e8;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.secondary{background:#eef3f9;color:#17345c}.hidden{display:none}.msg{min-height:22px;font-weight:700}.ok{color:#087a36}.err{color:#c62828}.note{font-size:13px;color:#63728a;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1}</style></head><body><main class="wrap"><section class="box"><span class="badge">OWNER ADMIN</span><h1>Change Admin Password</h1><p class="note">A one-time OTP will be sent only to the authorized Owner Admin email. No localhost link is used.</p><section id="step1"><form id="sendForm"><label>Admin Email<input id="email" type="email" value="junjharsingh740@gmail.com" autocomplete="email" required></label><button id="sendBtn">Send OTP</button><p id="sendMsg" class="msg"></p></form></section><section id="step2" class="hidden"><form id="verifyForm"><label>6-digit OTP<input id="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" placeholder="Enter OTP" required></label><label>New Password<input id="password" type="password" minlength="6" autocomplete="new-password" required></label><label>Confirm New Password<input id="confirm" type="password" minlength="6" autocomplete="new-password" required></label><div class="row"><button id="verifyBtn">Verify OTP & Change Password</button><button id="resendBtn" type="button" class="secondary">Resend OTP</button></div><p id="verifyMsg" class="msg"></p></form></section><p class="note">After a successful change, sign in again from the Admin Portal.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://rlidcatrwonemshwzafp.supabase.co',KEY='sb_publishable_ocJhWyfPg9rVhYROn_Vj0Q_DSSgxeuE',ADMIN='junjharsingh740@gmail.com',sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),setMsg=(id,t,c='')=>{$(id).textContent=t;$(id).className='msg '+c};async function sendOtp(){const email=$('email').value.trim().toLowerCase();if(email!==ADMIN){setMsg('sendMsg','Only the authorized Owner Admin email can use this page.','err');return false}const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.href}});if(r.error){setMsg('sendMsg',r.error.message,'err');return false}setMsg('sendMsg','OTP sent. Check your email and enter the code below.','ok');$('step2').classList.remove('hidden');return true}$('sendForm').onsubmit=async e=>{e.preventDefault();$('sendBtn').disabled=true;await sendOtp();$('sendBtn').disabled=false};$('resendBtn').onclick=async()=>{ $('resendBtn').disabled=true;await sendOtp();setTimeout(()=>$('resendBtn').disabled=false,1000)};$('verifyForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase(),otp=$('otp').value.trim(),p=$('password').value,c=$('confirm').value;if(email!==ADMIN)return setMsg('verifyMsg','Unauthorized email.','err');if(p!==c)return setMsg('verifyMsg','Passwords do not match.','err');if(!/^\d{6}$/.test(otp))return setMsg('verifyMsg','Enter the 6-digit OTP.','err');$('verifyBtn').disabled=true;$('verifyBtn').textContent='Verifying...';try{const r=await sb.auth.verifyOtp({email,token:otp,type:'email'});if(r.error)throw r.error;if((r.data.user?.email||'').toLowerCase()!==ADMIN){await sb.auth.signOut();throw new Error('Unauthorized account.')}const u=await sb.auth.updateUser({password:p});if(u.error)throw u.error;setMsg('verifyMsg','Admin password changed successfully.','ok');setTimeout(async()=>{await sb.auth.signOut();location.href='admin.html'},1200)}catch(err){setMsg('verifyMsg',err.message||'OTP verification failed.','err')}finally{$('verifyBtn').disabled=false;$('verifyBtn').textContent='Verify OTP & Change Password'}};</script></body></html>
