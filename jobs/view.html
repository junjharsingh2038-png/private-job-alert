<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Details | Private Job Alert</title>
<meta name="description" content="View job details and apply through Private Job Alert.">
<meta name="robots" content="noindex,follow">
<style>.brand img{width:48px;height:48px;object-fit:contain;display:block}.brand{gap:10px}</style>
<style>
.detail-wrap{max-width:900px;margin:32px auto;padding:0 16px}.detail-card{background:#fff;border:1px solid #dce5f0;border-radius:18px;padding:26px;box-shadow:0 8px 25px rgba(16,38,74,.07)}.detail-meta{display:flex;gap:12px;flex-wrap:wrap;color:#52647b;margin:18px 0}.detail-card h1{margin:8px 0}.detail-description{white-space:pre-wrap;line-height:1.8;color:#334155}.detail-error{padding:30px;text-align:center}.detail-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
</style>
<link rel="stylesheet" href="../portal-design.css?v=unified-master-20261118"><link rel="stylesheet" href="../job-share.css?v=social-poster-20261118"><link rel="stylesheet" href="../style.css?v=home-master-20261118"><link rel="stylesheet" href="../homepage-overrides.css?v=home-master-20261118"></head>
<body>
<header class="site-header">
<a class="brand" href="../index.html"><img class="brand-mark" src="../pja-logo.svg" alt="Private Job Alert logo"><span class="brand-copy"><strong>Private<span>Job</span>Alert</strong><small>LATEST JOBS <i>•</i> RIGHT OPPORTUNITIES <i>•</i> BRIGHT FUTURE</small></span></a>
<nav class="main-nav"><a href="../index.html">⌂ <span>Home</span></a><a href="../seeker.html">▣ <span>Job Seekers</span></a><a href="../hr.html">♟ <span>HR Portal</span></a><a href="../jobs/">▤ <span>Latest Jobs</span></a><a href="../index.html#about">● <span>About Us</span></a><a href="../index.html#contact">☎ <span>Contact</span></a></nav>
<div class="header-actions"><a class="login-link" href="../seeker.html">♙ Login</a><a class="register-link" href="../seeker.html">♟ Register</a></div>
</header>
<main class="detail-wrap"><article id="jobDetail" class="detail-card"><p>Loading job details...</p></article></main>
<div id="modal" class="modal hidden"><div class="modal-content"><button class="modal-close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<footer>© 2026 Private Job Alert India</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../app.js"></script>
<script src="../job-share.js?v=standard-poster-20261121-v2"></script>
<script>
(async function(){
 const root=document.getElementById("jobDetail");
 const params=new URLSearchParams(location.search);
 const id=params.get("id");
 const API="https://rlidcatrwonemshwzafp.supabase.co/rest/v1/jobs";
 const KEY="sb_publishable_ocJhWyfPg9rVhYROn_Vj0Q_DSSgxeuE";
 const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
 const error=(title,msg)=>{root.innerHTML='<div class="detail-error"><h1>'+esc(title)+'</h1><p>'+esc(msg)+'</p><a href="./">Browse latest jobs</a></div>';};
 if(!id){error("Job link is incomplete","This shared link does not contain a job ID. Open the job again from the latest jobs list.");return;}
 root.innerHTML="<p>Loading job details…</p>";
 try{
  const url=API+"?select=*&id=eq."+encodeURIComponent(id)+"&limit=1";
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),12000);
  let response;
  try{response=await fetch(url,{method:"GET",headers:{apikey:KEY,Authorization:"Bearer "+KEY,Accept:"application/json"},cache:"no-store",signal:controller.signal});}
  finally{clearTimeout(timer);}
  if(!response.ok){const detail=await response.text().catch(()=>"");throw new Error("Job database returned HTTP "+response.status+(detail?" — "+detail.slice(0,180):""));}
  const rows=await response.json();
  const j=Array.isArray(rows)?rows[0]:null;
  if(!j){error("Job not found","This job ID is not present in the job database. Please copy the share link again from the job card.");return;}
  window.PJA_CURRENT_JOB=j;
  const loc=[j.city,j.state].filter(Boolean).join(", ")||j.location||"India";
  document.title=(j.title||"Job Details")+" at "+(j.company||j.company_name||"Employer")+" | Private Job Alert";
  root.innerHTML='<span class="badge">JOB DETAILS</span><h1>'+esc(j.title||"Job Vacancy")+'</h1><h3>'+esc(j.company||j.company_name||"")+'</h3><div class="detail-meta"><span>📍 '+esc(loc)+'</span><span>💼 '+esc(j.job_type||j.type||"Full Time")+'</span><span>🎓 '+esc(j.qualification||"Any")+'</span><span>💰 '+esc(j.salary||"As per company")+'</span>'+(j.experience?'<span>Experience: '+esc(j.experience)+'</span>':'')+'</div><hr><h2>Job Description</h2><div class="detail-description">'+esc(j.description||"Please contact the employer for more details.")+'</div><div class="detail-actions"><a class="button" href="../apply.html?job='+encodeURIComponent(String(j.id))+'">Apply Now</a><button type="button" id="shareJobPoster" class="pja-detail-share">Share Job Poster ↗</button><a class="button secondary" href="./">All Jobs</a></div>';
  const share=document.getElementById("shareJobPoster");
  if(share)share.onclick=()=>window.PJAJobShare?.share(j);
  if(params.get("share")==="1")setTimeout(()=>window.PJAJobShare?.share(j),500);
 }catch(e){
  const msg=e.name==="AbortError"?"The job server took too long to respond. Please try again in a moment.":(e.message||"Unknown loading error");
  error("Unable to load job",msg);
 }
})();
</script>
</body></html>
