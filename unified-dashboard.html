<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dashboard | Private Job Alert</title><link rel="stylesheet" href="style.css"><style>
body{background:#f4f7fb}.dash-shell{max-width:1440px;margin:24px auto;padding:0 18px}.dash-head{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid #dce5f0;border-radius:18px;padding:20px 24px;margin-bottom:16px}.dash-head h1{margin:0;color:#082b55;font-size:25px}.dash-head p{margin:5px 0 0;color:#63728a}.dash-head button{border:0;border-radius:10px;background:#eaf1fb;color:#17365d;padding:11px 16px;font-weight:800;cursor:pointer}.dash-nav{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #dce5f0;border-radius:15px;padding:10px;margin-bottom:14px}.dash-nav button{border:0;border-radius:9px;background:transparent;color:#28415f;padding:11px 14px;font-weight:700;cursor:pointer}.dash-nav button.active,.dash-nav button:hover{background:#1264e8;color:#fff}#portalFrame{width:100%;height:calc(100vh - 205px);min-height:720px;border:1px solid #dce5f0;border-radius:16px;background:#fff}.dash-note{color:#68788d;font-size:12px;margin:10px 4px}@media(max-width:650px){.dash-shell{padding:0 10px;margin:12px auto}.dash-head{padding:15px}.dash-head h1{font-size:20px}.dash-nav{gap:4px}.dash-nav button{padding:9px;font-size:13px}#portalFrame{height:calc(100vh - 230px);min-height:700px}}
</style></head><body><main class="dash-shell"><header class="dash-head"><div><h1 id="dashTitle">My Workspace</h1><p id="dashSub">Your account, all in one place.</p></div><button id="dashLogout" type="button">Logout</button></header><nav class="dash-nav" id="dashNav"><button data-action="profile">My Profile</button><button data-action="edit">Edit Profile</button><button data-action="jobs">Find Jobs</button><button data-action="applications">My Applications</button><button data-action="saved">Saved Jobs</button><button data-action="alerts">Job Alerts</button><button data-action="invitations">Job Invitations</button><button data-action="post">Post New Job</button><button data-action="posted">My Posted Jobs</button><button data-action="employees">Employee Profiles</button><button data-action="invite">Send Invitation</button></nav><iframe id="portalFrame" title="Account dashboard content" loading="eager"></iframe><p class="dash-note">Your account sections open within this single dashboard workspace.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="unified-dashboard.js?v=1"></script></body></html>
