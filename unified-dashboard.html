<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dashboard | Private Job Alert</title><link rel="icon" href="pja-logo.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#14233a;font-family:Arial,sans-serif}.shell{max-width:1440px;margin:0 auto;padding:16px}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:1px solid #dce5f0;border-radius:16px;padding:14px 18px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px}.brand h1{font-size:20px;margin:0;color:#082b55}.brand p{margin:3px 0 0;color:#65758b;font-size:12px}.head-actions{display:flex;gap:8px;align-items:center}.head button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.logout{background:#eaf1fb;color:#17365d}.home{background:#1264e8;color:#fff}.nav{display:flex;gap:7px;flex-wrap:wrap;background:#fff;border:1px solid #dce5f0;border-radius:13px;padding:9px;margin-bottom:12px}.nav button{border:0;border-radius:8px;background:#f1f5fa;color:#29415e;padding:10px 12px;font-weight:700;cursor:pointer}.nav button.active{background:#1264e8;color:white}.nav button[hidden]{display:none!important}#portalFrame{display:block;width:100%;height:calc(100vh - 170px);min-height:650px;border:1px solid #dce5f0;border-radius:14px;background:#fff}.status{padding:10px;color:#68788d;font-size:13px}.error{color:#b00020}@media(max-width:650px){.shell{padding:8px}.head{padding:11px}.brand img{width:36px;height:36px}.brand h1{font-size:17px}.brand p{font-size:10px}.head button{padding:9px;font-size:12px}.nav{gap:5px}.nav button{padding:8px 9px;font-size:12px}#portalFrame{height:calc(100vh - 205px);min-height:560px}}
