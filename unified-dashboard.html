<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dashboard | Private Job Alert</title><link rel="icon" href="pja-logo.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172b45;font:15px Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:14px}.top,.picker,.panel{background:#fff;border:1px solid #dce5f0;border-radius:14px;padding:16px;margin-bottom:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px}.brand h1{font-size:19px;margin:0}.brand p{margin:4px 0 0;color:#64758b;font-size:12px}.actions{display:flex;gap:8px}.btn,button{border:0;border-radius:8px;padding:10px 14px;background:#1264e8;color:white;font-weight:700;cursor:pointer}.btn.secondary,button.secondary{background:#edf3fa;color:#24415f}.picker{display:flex;gap:12px;align-items:center}.picker label{font-weight:700}.picker select{flex:1;max-width:500px;padding:12px;border:1px solid #cad6e4;border-radius:9px;background:#fff;font-size:15px}.status{color:#61738a;padding:6px 2px;min-height:26px}.status.error{color:#b42318}.panel h2{margin:0 0 15px;color:#0b315e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d2deeb;border-radius:8px;font:14px Arial}.field textarea{min-height:90px;resize:vertical}.list{display:grid;gap:10px}.item{border:1px solid #e0e8f1;border-radius:11px;padding:14px;background:#fff}.item h3{margin:0 0 8px}.muted{color:#64758b;font-size:13px}.pill{display:inline-block;background:#e8f1fc;color:#164a87;border-radius:20px;padding:4px 9px;font-size:12px;font-weight:700}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.msg{padding:9px 0;color:#12633b}.danger{color:#b42318}.full{grid-column:1/-1}.profile-head{padding:20px;border-radius:12px;background:linear-gradient(110deg,#06417d,#0872c7,#f18b18);color:white;margin-bottom:14px}.profile-head h2{color:white}.empty{padding:24px;text-align:center;color:#66778b;background:#f7f9fc;border:1px dashed #d7e1ec;border-radius:10px}@media(max-width:650px){.wrap{padding:7px}.top{padding:10px}.brand img{width:34px;height:34px}.brand h1{font-size:16px}.actions button{padding:8px 9px;font-size:12px}.picker{align-items:stretch;flex-direction:column;padding:12px;gap:7px}.picker select{max-width:none;width:100%}.grid{grid-template-columns:1fr}.panel{padding:13px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="pja-logo.svg" alt=""><div><h1 id="title">My Dashboard</h1><p id="subtitle">Your account workspace</p></div></div><div class="actions"><button class="secondary" id="home">Home</button><button id="logout">Logout</button></div></header><section class="picker"><label for="section">Open section</label><select id="section"><option value="">Loading…</option></select></section><div class="status" id="status">Checking account…</div><section id="content"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="unified-dashboard.js?v=native-single-dashboard-1"></script></body></html>
