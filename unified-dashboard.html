<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dashboard | Private Job Alert</title><link rel="icon" href="pja-logo.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#14233a;font-family:Arial,sans-serif}.shell{max-width:1440px;margin:0 auto;padding:14px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid #dce5f0;border-radius:15px;padding:12px 16px;margin-bottom:10px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px}.brand h1{font-size:19px;margin:0;color:#082b55}.brand p{margin:3px 0 0;color:#65758b;font-size:12px}.head-right{display:flex;align-items:center;gap:10px}.head button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.home{background:#1264e8;color:white}.logout{background:#eaf1fb;color:#17365d}.nav{display:flex;gap:7px;flex-wrap:wrap;background:#fff;border:1px solid #dce5f0;border-radius:12px;padding:8px;margin-bottom:10px}.nav button{border:0;border-radius:8px;background:#f1f5fa;color:#29415e;padding:10px 12px;font-weight:700;cursor:pointer}.nav button.active{background:#1264e8;color:#fff}#portalFrame{display:block;width:100%;height:calc(100vh - 160px);min-height:610px;border:1px solid #dce5f0;border-radius:13px;background:#fff}.status{padding:8px 4px;color:#68788d;font-size:13px}.error{color:#b00020}@media(max-width:650px){.shell{padding:7px}.head{padding:9px}.brand img{width:34px;height:34px}.brand h1{font-size:16px}.brand p{font-size:10px}.head button{padding:8px 9px;font-size:12px}.nav{gap:5px}.nav button{padding:8px 9px;font-size:12px}#portalFrame{height:calc(100vh - 190px);min-height:560px}}</style></head><body><main class="shell"><header class="head"><div class="brand"><img src="pja-logo.svg" alt="Private Job Alert"><div><h1 id="dashTitle">My Dashboard</h1><p id="dashSub">Your account workspace</p></div></div><div class="head-right"><button class="home" id="homeBtn" type="button">Home</button><button class="logout" id="dashLogout" type="button">Logout</button></div></header><nav class="nav" id="dashNav" aria-label="Account sections"></nav><div id="dashStatus" class="status">Loading your account…</div><iframe id="portalFrame" title="Selected account section" loading="eager"></iframe></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="unified-dashboard.js?v=fixids20261121b"></script></body></html>
